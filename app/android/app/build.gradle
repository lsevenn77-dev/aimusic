apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
android {
 namespace 'kr.co.aifect.app'
 compileSdk 36
 defaultConfig {
  applicationId project.hasProperty('aifectTest') ? 'kr.co.aifect.app.test' : 'kr.co.aifect.app'
  manifestPlaceholders = [appLabel: project.hasProperty('aifectTest') ? 'AIFECT 테스트' : 'AIFECT']
  minSdk 26
  targetSdk 36
  versionCode 3
  versionName '2.0.0'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 }
 buildFeatures { buildConfig true; compose true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
 buildTypes { release { minifyEnabled false } }
 // Website assets and the JavaScript runtime are not packaged.
 sourceSets.main.assets.srcDirs = []
 packaging.resources.excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1']
}
dependencies {
 implementation 'androidx.appcompat:appcompat:1.7.1'
 implementation 'androidx.core:core-splashscreen:1.2.0'
 implementation 'androidx.activity:activity-compose:1.10.1'
 implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.1'
 implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.1'
 implementation platform('androidx.compose:compose-bom:2025.06.01')
 implementation 'androidx.compose.ui:ui'
 implementation 'androidx.compose.ui:ui-tooling-preview'
 implementation 'androidx.compose.material3:material3'
 implementation 'androidx.compose.material:material-icons-extended'
 implementation 'io.coil-kt:coil-compose:2.7.0'
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
 implementation 'androidx.media3:media3-exoplayer:1.8.0'
 implementation 'androidx.media3:media3-session:1.8.0'
 implementation 'androidx.media3:media3-datasource-okhttp:1.8.0'
 testImplementation 'junit:junit:4.13.2'
 androidTestImplementation 'androidx.test.ext:junit:1.3.0'
 androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
 androidTestImplementation platform('androidx.compose:compose-bom:2025.06.01')
 androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
 debugImplementation 'androidx.compose.ui:ui-test-manifest'
 debugImplementation 'androidx.compose.ui:ui-tooling'
}
