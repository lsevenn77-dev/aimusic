services:
  billing:
    build: ./billing
    restart: unless-stopped
    env_file: .env.billing
    read_only: true
    tmpfs:
      - /tmp:size=1m,mode=1777
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 32
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import time; assert time.time()-float(open('/tmp/last-success').read()) < 240"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
