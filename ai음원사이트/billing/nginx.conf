# AIFECT NICEPAY webhook relay. Activate only after billing.aifect.co.kr
# resolves to the existing server and its TLS certificate has been issued.
# /api/billing/nicepay/webhook in Sites still verifies signatures, gateway
# order ownership, amount and fresh payment status before changing access.
server {
    listen 80;
    server_name billing.aifect.co.kr;
    location ^~ /.well-known/acme-challenge/ { root /var/www/aifect-billing-acme; }
    location / { return 301 https://billing.aifect.co.kr$request_uri; }
}
server {
    listen 443 ssl;
    server_name billing.aifect.co.kr;
    ssl_certificate /etc/letsencrypt/live/billing.aifect.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/billing.aifect.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    access_log off;
    location = /nicepay {
        limit_except GET POST { deny all; }
        if ($request_method = GET) { return 200 'OK'; }
        # This server has no IPv6 route. Resolve the upstream dynamically over IPv4.
        resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;
        resolver_timeout 5s;
        set $aifect_target wavv-music-design-lseve.sassy-auk-0975.chatgpt.site;
        proxy_pass https://$aifect_target/api/billing/nicepay/webhook;
        proxy_set_header Host wavv-music-design-lseve.sassy-auk-0975.chatgpt.site;
        proxy_set_header User-Agent 'AIFECT-NICEPAY-Webhook/1.0';
        proxy_set_header Authorization '';
        proxy_set_header Cookie '';
        proxy_ssl_server_name on;
        proxy_ssl_name wavv-music-design-lseve.sassy-auk-0975.chatgpt.site;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_next_upstream off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 70s;
        add_header Cache-Control no-store always;
    }
    # Native Android test build, served as an immutable public download.
    location = /downloads/AIFECT-2.3.0.apk {
        alias /var/www/aifect-downloads/AIFECT-2.3.0.apk;
        limit_except GET { deny all; }
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="AIFECT-2.3.0.apk"' always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / { return 404; }
}
