services:
  lyrics:
    build: ./alignment
    image: aifect-lyrics
    restart: unless-stopped
    env_file: .env
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: { max-size: 5m, max-file: "2" }
