# Separate opt-in Compose project; does not restart the music transcoder.
services:
  dubbing:
    build:
      context: .
      dockerfile: Dockerfile.dubbing
    restart: unless-stopped
    env_file: .env
    read_only: true
    tmpfs:
      - /tmp:size=768m,mode=1777
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: { max-size: 5m, max-file: "2" }
