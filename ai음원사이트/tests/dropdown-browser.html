<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="/design-system.css"><link rel="stylesheet" href="/dropdown.css"><style>body{padding:12px;margin:0;font:14px sans-serif}.row{display:flex;gap:8px;max-width:100%;overflow:hidden}.row>.aifect-dropdown{max-width:140px}#edge{position:fixed;right:12px;bottom:12px;width:100px}#result{white-space:pre-wrap}</style><h1>Dropdown browser regression</h1><button id="run">Run regression</button><pre id="result">Ready</pre><form id="fixture"><div class="row"><select data-dropdown="sm" aria-label="Small" name="sort"><option value="a">인기순</option><option value="disabled" disabled>선택 불가</option><option value="b">최신순</option><option value="long">매우 긴 정렬 기준 문구가 주변 레이아웃을 침범하지 않아야 합니다</option></select></div><select data-dropdown="md" aria-label="Medium"><option>중간</option></select><select data-dropdown="lg" aria-label="Large"><option>큰 크기</option></select><select data-dropdown="md" disabled aria-label="Disabled"><option>비활성</option></select><div id="api"></div><div id="edge"><select data-dropdown="sm" aria-label="Edge"><option value="a">짧음</option><option value="b">아주 긴 항목이 화면 오른쪽을 넘지 않고 위로 열려야 합니다</option><option value="c">전체</option></select></div></form><script src="/dropdown.js"></script><script>
const run=document.querySelector('#run'),result=document.querySelector('#result'),frame=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
run.onclick=async()=>{const checks=[],assert=(ok,name)=>{checks.push({name,pass:!!ok});if(!ok)throw Error(name);},select=document.querySelector('[name=sort]'),button=select.previousElementSibling;let input=0,change=0;select.addEventListener('input',()=>input++);select.addEventListener('change',()=>change++);try{
assert(new FormData(document.querySelector('form')).get('sort')==='a','native FormData preserved');
button.click();await frame();button.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowDown',bubbles:true}));button.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true}));assert(select.value==='b'&&input===1&&change===1,'arrows skip disabled, Enter emits exactly one input/change');
select.value='a';assert(button.textContent==='인기순','programmatic value synchronizes');
button.dispatchEvent(new KeyboardEvent('keydown',{key:' ',bubbles:true}));assert(button.getAttribute('aria-expanded')==='true','Space opens');button.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));assert(button.getAttribute('aria-expanded')==='false'&&document.activeElement===button,'Escape retains focus');
button.click();run.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true}));assert(button.getAttribute('aria-expanded')==='false','outside pointer closes');
button.click();button.dispatchEvent(new KeyboardEvent('keydown',{key:'Tab',bubbles:true}));assert(button.getAttribute('aria-expanded')==='false','Tab closes');
select.value='long';await frame();assert(button.querySelector('span').scrollWidth>button.querySelector('span').clientWidth,'only long label truncates');assert(button.querySelector('svg').getBoundingClientRect().right<=button.getBoundingClientRect().right-10,'chevron stays inside');
const edge=document.querySelector('#edge .aifect-dropdown-trigger');edge.click();await frame();let m=document.querySelector('.aifect-dropdown-menu'),r=m.getBoundingClientRect(),b=edge.getBoundingClientRect();assert(m.dataset.placement==='top'&&r.left>=12&&r.right<=innerWidth-12&&r.bottom<b.top,'bottom/right edge flips and clamps');
window.dispatchEvent(new Event('resize'));await frame();assert(m.getBoundingClientRect().right<=innerWidth-12,'resize stays anchored');window.dispatchEvent(new Event('scroll'));await frame();assert(m.getBoundingClientRect().bottom<edge.getBoundingClientRect().top,'scroll stays anchored');edge.click();
for(const [name,height] of [['Small',34],['Medium',38],['Large',40]]){const c=document.querySelector('[aria-label="'+name+'"].aifect-dropdown-trigger');assert(c.getBoundingClientRect().height===height,name+' visual height');if(innerWidth<768)assert(c.parentElement.getBoundingClientRect().height>=42,name+' mobile touch target');}
assert(document.querySelector('[aria-label=Disabled].aifect-dropdown-trigger').disabled,'disabled forwarded');
const container=document.querySelector('#api');container.replaceChildren();let changes=0;const api=AifectDropdown.create(container,{size:'lg',width:'full',value:'two',options:[{value:'one',label:'하나'},{value:'two',label:'둘'}],onChange:()=>changes++,'aria-label':'API'});assert(api.button.textContent==='둘'&&api.element.dataset.width==='full','API options/value/size/full');api.set({value:'one',disabled:true,width:120});assert(api.button.textContent==='하나'&&api.button.disabled&&api.element.style.width==='120px'&&changes===0,'API controlled update/disabled/explicit width');
result.textContent=JSON.stringify({pass:true,width:innerWidth,checks},null,2);
}catch(e){result.textContent=JSON.stringify({pass:false,width:innerWidth,error:e.message,checks},null,2);}};
</script>
