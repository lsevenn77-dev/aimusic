<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAVV — 새로운 음악의 시작</title>
  <meta name="description" content="AI 음악의 발견과 창작자를 위한 WAVV 웹 디자인 시안">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23cbfa75'/%3E%3Cpath d='m10 23 9 22 13-27 13 27 9-22' fill='none' stroke='%23121416' stroke-width='6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <a href="#home" class="brand" aria-label="WAVV 홈"><svg viewBox="0 0 36 28" aria-hidden="true"><path d="m2 6 7 18L18 4l9 20 7-18"/></svg>WAVV<span>®</span></a>
    <p class="nav-label">음악 둘러보기</p>
    <nav class="nav-primary" aria-label="주 메뉴">
      <a href="#home" class="nav-link active" data-view="home"><i data-icon="home"></i>홈</a>
      <a href="#discover" class="nav-link" data-view="discover"><i data-icon="compass"></i>발견<span class="nav-tag">NEW</span></a>
      <a href="#charts" class="nav-link" data-view="charts"><i data-icon="chart"></i>차트</a>
      <a href="#artists" class="nav-link" data-view="artists"><i data-icon="users"></i>아티스트</a>
    </nav>
    <p class="nav-label second-label">나의 음악</p>
    <nav aria-label="나의 메뉴">
      <a href="#library" class="nav-link" data-view="library"><i data-icon="library"></i>내 보관함</a>
      <a href="#gifts" class="nav-link" data-view="gifts"><i data-icon="gift"></i>골드 & 선물</a>
    </nav>
    <div class="sidebar-divider"></div>
    <a href="#studio" class="nav-link" data-view="studio"><i data-icon="sliders"></i>창작자 스튜디오<i data-icon="external" class="end-icon"></i></a>
    <div class="sidebar-bottom">
      <div class="creator-callout"><span class="tiny-eyebrow">FOR CREATORS</span><p>당신의 음악,<br>누군가의 새로운 취향.</p><a href="#studio">첫 곡 업로드하기 <i data-icon="arrow"></i></a></div>
      <a class="profile" href="#account"><span class="avatar">J</span><span><strong>음악을 찾는 중</strong><small>내 계정</small></span><i data-icon="chevron"></i></a>
      <a href="#admin" class="admin-link">운영자 화면 시안 <i data-icon="external"></i></a>
    </div>
  </aside>
  <div class="page-wrap">
    <header class="topbar">
      <button class="icon-button mobile-menu" aria-label="메뉴 열기" id="menu-toggle"><i data-icon="menu"></i></button>
      <div class="crumb">새로운 음악의 시작</div>
      <a href="#search" class="search-box"><i data-icon="search"></i><span>곡, 아티스트, 분위기를 검색하세요</span><span class="search-key">⌕</span></a>
      <div class="top-actions"><span class="design-badge">DESIGN PREVIEW</span><button class="icon-button" aria-label="알림" data-demo="알림"><i data-icon="bell"></i></button><a href="#upload" class="upload-button"><i data-icon="plus"></i>음원 업로드</a></div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="page-footer"><span>WAVV® · MUSIC BEYOND LIMITS</span><span>디자인 시안 · 아티스트와 음악 정보는 예시입니다.</span></footer>
  </div>
  <section class="player" aria-label="공통 음악 플레이어 시안">
    <div class="now-playing"><div class="mini-cover cover cover-ocean"></div><div><strong>파도가 잠든 밤</strong><span>NOVA <b class="ai-mini">AI</b></span></div><button class="icon-button like-button" aria-label="좋아요" data-demo="좋아요"><i data-icon="heart"></i></button></div>
    <div class="player-center"><div class="player-buttons"><button class="icon-button" aria-label="셔플" data-demo="셔플"><i data-icon="shuffle"></i></button><button class="icon-button" aria-label="이전 곡" data-demo="이전 곡"><i data-icon="previous"></i></button><button class="play-button" aria-label="재생 시안" data-demo="음악 재생"><i data-icon="play"></i></button><button class="icon-button" aria-label="다음 곡" data-demo="다음 곡"><i data-icon="next"></i></button><button class="icon-button" aria-label="반복 재생" data-demo="반복 재생"><i data-icon="repeat"></i></button></div><div class="timeline"><span>0:00</span><div class="timeline-track"><div></div></div><span>3:42</span></div></div>
    <div class="player-right"><a href="#gifts" class="gift-link"><i data-icon="gift"></i>선물하기</a><span class="player-divider"></span><button class="icon-button" aria-label="음량" data-demo="음량"><i data-icon="volume"></i></button><div class="volume-track"></div><button class="icon-button" aria-label="재생 목록" data-demo="재생 목록"><i data-icon="list"></i></button></div>
  </section>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
